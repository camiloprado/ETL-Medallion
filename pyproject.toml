[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "br-open-data-medallion"
version = "0.1.0"
description = "Batch medallion pipeline (bronze → silver → gold) for Brazilian open data via BrasilAPI."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Camilo Prado" }]
keywords = ["data-engineering", "medallion", "brasilapi", "etl", "postgres"]
dependencies = [
  "httpx>=0.27",
  "pandas>=2.2",
  "pyarrow>=16",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.4",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
br-open-data = "pipeline.cli:main"

[project.urls]
Homepage = "https://github.com/camiloprado"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
